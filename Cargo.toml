[workspace]
resolver = "3"
members = [
    "crates/geometry-tag",
    "crates/geometry-coords",
    "crates/geometry-cs",
    "crates/geometry-trait",
    "crates/geometry-model",
    "crates/geometry-strategy",
    "crates/geometry-algorithm",
    "crates/geometry-adapt",
    "crates/geometry-adapt-nalgebra",
    "crates/geometry-adapt-geo-types",
    "crates/geometry-derive",
    "crates/geometry-io-wkt",
    "crates/geometry-io-wkb",
    "crates/geometry-io-geojson",
    "crates/geometry-io-svg",
    "crates/geometry-overlay",
    "crates/geometry-rtree",
    "crates/geometry-proj",
    "crates/geometry",
]

[workspace.package]
version      = "0.0.5"
edition      = "2024"
rust-version = "1.85"
license      = "BSL-1.0"
license-file = "LICENSE"
repository   = "https://github.com/pentatonick/boost_geometry"
keywords     = ["geometry", "gis", "spatial", "boost", "computation"]
categories   = ["science::geo", "algorithms", "mathematics", "no-std"]

[workspace.dependencies]
geometry-tag       = { version = "0.0.5", path = "crates/geometry-tag",       default-features = false }
geometry-coords    = { version = "0.0.5", path = "crates/geometry-coords",    default-features = false }
geometry-cs        = { version = "0.0.5", path = "crates/geometry-cs",        default-features = false }
geometry-trait     = { version = "0.0.5", path = "crates/geometry-trait",     default-features = false }
geometry-model     = { version = "0.0.5", path = "crates/geometry-model",     default-features = false }
geometry-strategy  = { version = "0.0.5", path = "crates/geometry-strategy",  default-features = false }
geometry-algorithm = { version = "0.0.5", path = "crates/geometry-algorithm", default-features = false }
geometry-adapt     = { version = "0.0.5", path = "crates/geometry-adapt",     default-features = false }
geometry-derive    = { version = "0.0.5", path = "crates/geometry-derive",    default-features = false }
geometry-overlay   = { version = "0.0.5", path = "crates/geometry-overlay",   default-features = false }
geometry-rtree     = { version = "0.0.5", path = "crates/geometry-rtree",     default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"  # kernel crates re-allow with explicit justification

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
