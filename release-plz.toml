[workspace]
# Each crate declares its own version; intra-workspace dependency version
# requirements stay centralized in [workspace.dependencies] in the root
# Cargo.toml, and release-plz rewrites them on bump. Cargo's
# [workspace.package] version inheritance is NOT used: release-plz only
# releases (and rewrites requirements for) crates with changes, but the
# inheritance bumps every crate's version implicitly, leaving the
# requirements on unchanged crates stale — `cargo update` then fails with
# "failed to select a version" during the release PR job.
# The shared `version_group` below keeps the versions of crates released
# together aligned to the same next version.
# Publishing, tagging, and the GitHub release are handled by
# .github/workflows/publish.yml on `v*` tag push.
publish = false
git_tag_enable = false
git_release_enable = false
changelog_update = true

# Only commits that change what ships warrant a release PR. Without this
# filter release-plz counts its own "chore: release vX.Y.Z" commit (and
# bare merge commits) as unreleased changes, so every merged release PR
# immediately spawns the next one — an empty-release feedback loop
# (#14 → #15 → #16).
release_commits = "^(feat|fix|perf|docs|refactor|build|deps)"

# Tag the workspace release (one tag for the release version, created on
# the facade crate only). The tag push triggers publish.yml.
[[package]]
name = "boost_geometry"
git_tag_enable = true
git_tag_name = "v{{ version }}"
version_group = "lockstep"

