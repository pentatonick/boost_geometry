[package]
name = "geometry-algorithm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description = "Free-function algorithms (distance, length, area, within, intersects, …)."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-strategy/std",
    "geometry-model/std",
]
libm = [
    "geometry-coords/libm",
    "geometry-trait/libm",
    "geometry-strategy/libm",
    "geometry-model/libm",
]

[dependencies]
geometry-coords   = { path = "../geometry-coords",   default-features = false }
geometry-tag      = { path = "../geometry-tag",      default-features = false }
geometry-cs       = { path = "../geometry-cs",       default-features = false }
geometry-trait    = { path = "../geometry-trait",    default-features = false }
geometry-strategy = { path = "../geometry-strategy", default-features = false }
geometry-model    = { path = "../geometry-model",    default-features = false }

[dev-dependencies]
geometry-adapt    = { path = "../geometry-adapt" }
geometry-coords   = { path = "../geometry-coords" }
geometry-cs       = { path = "../geometry-cs" }
geometry-derive   = { path = "../geometry-derive" }
geometry-model    = { path = "../geometry-model" }
geometry-strategy = { path = "../geometry-strategy" }
geometry-tag      = { path = "../geometry-tag" }
geometry-trait    = { path = "../geometry-trait" }

[lints]
workspace = true
