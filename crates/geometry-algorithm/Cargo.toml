[package]
name = "geometry-algorithm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Free-function algorithms (distance, length, area, within, intersects, …) ported from Boost.Geometry."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-strategy/std",
    "geometry-model/std",
]
libm = [
    "geometry-coords/libm",
    "geometry-trait/libm",
    "geometry-strategy/libm",
    "geometry-model/libm",
]

[dependencies]
geometry-coords   = { workspace = true, default-features = false }
geometry-tag      = { workspace = true, default-features = false }
geometry-cs       = { workspace = true, default-features = false }
geometry-trait    = { workspace = true, default-features = false }
geometry-strategy = { workspace = true, default-features = false }
geometry-model    = { workspace = true, default-features = false }

[dev-dependencies]
geometry-adapt    = { workspace = true, features = ["std"] }
geometry-coords   = { workspace = true, features = ["std"] }
geometry-cs       = { workspace = true, features = ["std"] }
geometry-derive   = { workspace = true }
geometry-model    = { workspace = true, features = ["std"] }
geometry-strategy = { workspace = true, features = ["std"] }
geometry-tag      = { workspace = true }
geometry-trait    = { workspace = true, features = ["std"] }

[lints]
workspace = true
