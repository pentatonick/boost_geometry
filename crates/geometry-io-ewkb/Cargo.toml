[package]
name = "geometry-io-ewkb"
version                = "0.0.11"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "PostGIS Extended Well-Known Binary (EWKB) reader and writer for the geometry model."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-io-wkb/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-model/std",
]
libm = [
    "geometry-io-wkb/libm",
    "geometry-cs/libm",
    "geometry-trait/libm",
    "geometry-model/libm",
]

[dependencies]
geometry-io-wkb = { version = "0.0.11", path = "../geometry-io-wkb", default-features = false }
geometry-srid   = { version = "0.0.11", path = "../geometry-srid" }
geometry-cs     = { version = "0.0.11", path = "../geometry-cs",     default-features = false }
geometry-trait  = { version = "0.0.11", path = "../geometry-trait",  default-features = false }
geometry-model  = { version = "0.0.11", path = "../geometry-model",  default-features = false }

[dev-dependencies]
geometry-tag = { version = "0.0.11", path = "../geometry-tag" }

[lints]
workspace = true
