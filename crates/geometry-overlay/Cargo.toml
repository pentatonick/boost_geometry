[package]
name = "geometry-overlay"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Segment-intersection kernel, turn graph, and boolean overlay (intersection/union/difference) for the Boost.Geometry Rust port."
readme = "README.md"

[features]
default = ["std"]
std = []

[dependencies]
geometry-tag       = { workspace = true }
geometry-coords    = { workspace = true, features = ["std"] }
geometry-cs        = { workspace = true, features = ["std"] }
geometry-trait     = { workspace = true, features = ["std"] }
geometry-model     = { workspace = true, features = ["std"] }
geometry-strategy  = { workspace = true, features = ["std"] }
geometry-algorithm = { workspace = true, features = ["std"] }

[lints]
workspace = true
