[package]
name = "geometry-overlay"
version                = "0.0.6"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Segment-intersection kernel, turn graph, and boolean overlay (intersection/union/difference) for the Boost.Geometry Rust port."
readme = "README.md"

[features]
default = ["std"]
std = []

[dependencies]
geometry-tag       = { version = "0.0.6", path = "../geometry-tag" }
geometry-coords    = { version = "0.0.6", path = "../geometry-coords" }
geometry-cs        = { version = "0.0.6", path = "../geometry-cs" }
geometry-trait     = { version = "0.0.6", path = "../geometry-trait" }
geometry-model     = { version = "0.0.6", path = "../geometry-model" }
geometry-strategy  = { version = "0.0.6", path = "../geometry-strategy" }
geometry-algorithm = { version = "0.0.6", path = "../geometry-algorithm" }

[lints]
workspace = true
