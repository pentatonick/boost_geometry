[package]
name = "geometry-strategy"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Pluggable per-coordinate-system strategies (Pythagoras, Haversine, Vincenty, …)."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-model/std",
]
libm = [
    "geometry-coords/libm",
    "geometry-trait/libm",
    "geometry-model/libm",
]

[dependencies]
geometry-tag    = { version = "0.0.3", path = "../geometry-tag" }
geometry-coords = { version = "0.0.3", path = "../geometry-coords", default-features = false }
geometry-cs     = { version = "0.0.3", path = "../geometry-cs",     default-features = false }
geometry-trait  = { version = "0.0.3", path = "../geometry-trait",  default-features = false }
geometry-model  = { version = "0.0.3", path = "../geometry-model",  default-features = false }

[dev-dependencies]
geometry-adapt = { path = "../geometry-adapt" }
trybuild       = "1"

[lints]
workspace = true
