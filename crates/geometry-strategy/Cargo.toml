[package]
name = "geometry-strategy"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Pluggable per-coordinate-system strategies (Pythagoras, Haversine, Vincenty, …), Boost.Geometry style."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-model/std",
]
libm = [
    "geometry-coords/libm",
    "geometry-trait/libm",
    "geometry-model/libm",
]

[dependencies]
geometry-tag    = { workspace = true }
geometry-coords = { workspace = true, default-features = false }
geometry-cs     = { workspace = true, default-features = false }
geometry-trait  = { workspace = true, default-features = false }
geometry-model  = { workspace = true, default-features = false }

[dev-dependencies]
geometry-adapt = { workspace = true, features = ["std"] }
trybuild       = "1"

[lints]
workspace = true
