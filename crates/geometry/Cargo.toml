[package]
name = "boost_geometry"
version                = "0.0.7"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Rust port of Boost.Geometry — same design philosophy (concepts, tags, strategy-based dispatch), works with your own point/geometry types, re-exported as a single API surface."
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-model/std",
    "geometry-strategy/std",
    "geometry-algorithm/std",
    "geometry-adapt/std",
    "geometry-overlay/std",
    "geometry-rtree/std",
]
libm = [
    "geometry-coords/libm",
    "geometry-cs/libm",
    "geometry-trait/libm",
    "geometry-model/libm",
    "geometry-strategy/libm",
    "geometry-algorithm/libm",
    "geometry-adapt/libm",
    "geometry-overlay/libm",
]

[dependencies]
geometry-tag       = { version = "0.0.7", path = "../geometry-tag" }
geometry-coords    = { version = "0.0.7", path = "../geometry-coords",    default-features = false }
geometry-cs        = { version = "0.0.7", path = "../geometry-cs",        default-features = false }
geometry-trait     = { version = "0.0.7", path = "../geometry-trait",     default-features = false }
geometry-model     = { version = "0.0.7", path = "../geometry-model",     default-features = false }
geometry-strategy  = { version = "0.0.7", path = "../geometry-strategy",  default-features = false }
geometry-algorithm = { version = "0.0.7", path = "../geometry-algorithm", default-features = false }
geometry-adapt     = { version = "0.0.7", path = "../geometry-adapt",     default-features = false }
geometry-overlay   = { version = "0.0.7", path = "../geometry-overlay",   default-features = false }
geometry-rtree     = { version = "0.0.7", path = "../geometry-rtree",     default-features = false }
geometry-derive    = { version = "0.0.7", path = "../geometry-derive" }

[dev-dependencies]
trybuild = "1"
criterion = "0.5"

[[bench]]
name = "distance"
harness = false

[[bench]]
name = "measures"
harness = false

[[bench]]
name = "predicates"
harness = false

[lints]
workspace = true
