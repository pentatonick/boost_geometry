[package]
name = "boost_geometry"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Rust port of Boost.Geometry — same design philosophy (concepts, tags, strategy-based dispatch), works with your own point/geometry types, re-exported as a single API surface."
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-model/std",
    "geometry-strategy/std",
    "geometry-algorithm/std",
    "geometry-adapt/std",
    "geometry-overlay/std",
    "geometry-rtree/std",
]
libm = [
    "geometry-coords/libm",
    "geometry-cs/libm",
]

[dependencies]
geometry-tag       = { workspace = true }
geometry-coords    = { workspace = true, default-features = false }
geometry-cs        = { workspace = true, default-features = false }
geometry-trait     = { workspace = true, default-features = false }
geometry-model     = { workspace = true, default-features = false }
geometry-strategy  = { workspace = true, default-features = false }
geometry-algorithm = { workspace = true, default-features = false }
geometry-adapt     = { workspace = true, default-features = false }
geometry-overlay   = { workspace = true, default-features = false }
geometry-rtree     = { workspace = true, default-features = false }
geometry-derive    = { workspace = true }

[dev-dependencies]
trybuild = "1"
criterion = "0.5"

[[bench]]
name = "distance"
harness = false

[[bench]]
name = "measures"
harness = false

[[bench]]
name = "predicates"
harness = false

[lints]
workspace = true
