[package]
name = "geometry-model"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Built-in concrete geometry types (Point, Segment, Box, Linestring, Polygon, …) mirroring Boost.Geometry models — or bring your own via the concept traits."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
]
libm = ["geometry-coords/libm", "geometry-trait/libm"]
serde = ["dep:serde"]

[dependencies]
geometry-tag    = { workspace = true }
geometry-coords = { workspace = true, default-features = false }
geometry-cs     = { workspace = true, default-features = false }
geometry-trait  = { workspace = true, default-features = false }
serde           = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
trybuild        = "1"
geometry-coords = { workspace = true, features = ["std"] } # bring std for tests
geometry-cs     = { workspace = true, features = ["std"] } # bring std for tests
geometry-trait  = { workspace = true, features = ["std"] } # bring std for tests
serde_json      = "1"                               # serde round-trip tests

[lints]
workspace = true
