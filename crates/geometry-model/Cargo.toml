[package]
name = "geometry-model"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Built-in concrete geometry types (Point, Segment, Box, Linestring, Polygon, …)."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
]
libm = ["geometry-coords/libm", "geometry-trait/libm"]
serde = ["dep:serde"]

[dependencies]
geometry-tag    = { version = "0.0.5", path = "../geometry-tag" }
geometry-coords = { version = "0.0.5", path = "../geometry-coords", default-features = false }
geometry-cs     = { version = "0.0.5", path = "../geometry-cs",     default-features = false }
geometry-trait  = { version = "0.0.5", path = "../geometry-trait",  default-features = false }
serde           = { version = "1", optional = true, default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
trybuild        = "1"
geometry-coords = { path = "../geometry-coords" }   # bring std for tests
geometry-cs     = { path = "../geometry-cs" }       # bring std for tests
geometry-trait  = { path = "../geometry-trait" }    # bring std for tests
serde_json      = "1"                               # serde round-trip tests

[lints]
workspace = true
