[package]
name = "geometry-io-ewkt"
version = "0.0.10"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "PostGIS Extended Well-Known Text (EWKT) reader and writer for the geometry model."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-io-wkt/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-model/std",
]
libm = [
    "geometry-io-wkt/libm",
    "geometry-cs/libm",
    "geometry-trait/libm",
    "geometry-model/libm",
]

[dependencies]
geometry-io-wkt = { version = "0.0.10", path = "../geometry-io-wkt", default-features = false }
geometry-cs     = { version = "0.0.10", path = "../geometry-cs",     default-features = false }
geometry-trait  = { version = "0.0.10", path = "../geometry-trait",  default-features = false }
geometry-model  = { version = "0.0.10", path = "../geometry-model",  default-features = false }
geometry-srid   = { version = "0.0.10", path = "../geometry-srid" }

[dev-dependencies]
geometry-tag = { version = "0.0.10", path = "../geometry-tag" }

[lints]
workspace = true
