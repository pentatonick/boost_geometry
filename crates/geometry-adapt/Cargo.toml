[package]
name = "geometry-adapt"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Adapters and registration macros for foreign point/linestring/polygon types."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
]
libm = [
    "geometry-coords/libm",
    "geometry-trait/libm",
]

[dependencies]
geometry-tag    = { workspace = true }
geometry-coords = { workspace = true, default-features = false }
geometry-cs     = { workspace = true, default-features = false }
geometry-trait  = { workspace = true, default-features = false }

[dev-dependencies]
geometry-algorithm = { workspace = true, features = ["std"] }
geometry-cs        = { workspace = true, features = ["std"] } # bring std for tests
geometry-model     = { workspace = true, features = ["std"] }
geometry-trait     = { workspace = true, features = ["std"] } # bring std for tests

[lints]
workspace = true
