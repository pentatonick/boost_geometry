[package]
name = "geometry-rtree"
version                = "0.0.9"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "R-tree spatial index over the geometry kernel — insert, spatial query, and nearest-neighbour search."
readme = "README.md"

[features]
default = ["std"]
std = [
    "geometry-coords/std",
    "geometry-cs/std",
    "geometry-trait/std",
    "geometry-model/std",
]
libm = [
    "geometry-coords/libm",
    "geometry-cs/libm",
    "geometry-trait/libm",
    "geometry-model/libm",
]
serde = ["dep:serde", "geometry-model/serde"]

[dependencies]
geometry-coords = { version = "0.0.9", path = "../geometry-coords", default-features = false, features = ["libm"] }
geometry-cs     = { version = "0.0.9", path = "../geometry-cs",     default-features = false }
geometry-trait  = { version = "0.0.9", path = "../geometry-trait",  default-features = false }
geometry-model  = { version = "0.0.9", path = "../geometry-model",  default-features = false }
heapless        = { version = "0.8", default-features = false }
serde              = { version = "1", optional = true, default-features = false, features = ["alloc", "derive"] }

# Workspace lints, except `unsafe_code` steps down from `forbid` to
# `deny`: a Cargo-level forbid is a CLI lint that no source attribute
# may re-allow (E0453), and `tests/nearest_alloc_budget.rs` needs a
# file-scoped allow for its counting `GlobalAlloc`. The library itself
# keeps `#![forbid(unsafe_code)]` in `lib.rs`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
