[package]
name = "geometry-rtree"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "R-tree spatial index over the geometry kernel — insert, spatial query, and nearest-neighbour search."
readme = "README.md"

[features]
default = ["std"]
std = []

[dependencies]
geometry-tag       = { version = "0.0.5", path = "../geometry-tag" }
geometry-coords    = { version = "0.0.5", path = "../geometry-coords" }
geometry-cs        = { version = "0.0.5", path = "../geometry-cs" }
geometry-trait     = { version = "0.0.5", path = "../geometry-trait" }
geometry-model     = { version = "0.0.5", path = "../geometry-model" }
geometry-algorithm = { version = "0.0.5", path = "../geometry-algorithm" }
heapless           = "0.8"

[dev-dependencies]
rstar         = "0.12.2"
iai-callgrind = "0.14"

[[bench]]
name = "parity_iai"
harness = false

[[bench]]
name = "knn_capacity_iai"
harness = false

[[bench]]
name = "bulk_layout_iai"
harness = false

# Workspace lints, except `unsafe_code` steps down from `forbid` to
# `deny`: a Cargo-level forbid is a CLI lint that no source attribute
# may re-allow (E0453), and `tests/nearest_alloc_budget.rs` needs a
# file-scoped allow for its counting `GlobalAlloc`. The library itself
# keeps `#![forbid(unsafe_code)]` in `lib.rs`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
