[package]
name = "geometry-proj"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Coordinate-reference-system reprojection for the geometry kernel, backed by the pure-Rust proj4rs engine."
readme = "README.md"

[dependencies]
geometry-tag    = { workspace = true }
geometry-coords = { workspace = true, features = ["std"] }
geometry-cs     = { workspace = true, features = ["std"] }
geometry-trait  = { workspace = true, features = ["std"] }
geometry-model  = { workspace = true, features = ["std"] }
proj4rs         = { version = "0.1", features = ["crs-definitions"] }
proj4wkt        = "0.1"

[lints]
workspace = true
