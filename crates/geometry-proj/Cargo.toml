[package]
name = "geometry-proj"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
description = "Coordinate-reference-system reprojection for the geometry kernel, backed by the pure-Rust proj4rs engine."
readme = "README.md"

[dependencies]
geometry-tag    = { version = "0.0.2", path = "../geometry-tag" }
geometry-coords = { version = "0.0.2", path = "../geometry-coords" }
geometry-cs     = { version = "0.0.2", path = "../geometry-cs" }
geometry-trait  = { version = "0.0.2", path = "../geometry-trait" }
geometry-model  = { version = "0.0.2", path = "../geometry-model" }
proj4rs         = { version = "0.1", features = ["crs-definitions"] }
proj4wkt        = "0.1"

[lints]
workspace = true
