[package]
name = "geometry-trait"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
license-file.workspace = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Concept traits (Point, Linestring, Ring, Polygon, multi-variants, …) for the Boost.Geometry Rust port — implement them for your own types."
readme = "README.md"

[features]
default = ["std"]
std = ["geometry-coords/std", "geometry-cs/std"]
libm = ["geometry-coords/libm"]

[dependencies]
geometry-tag    = { workspace = true }
geometry-coords = { workspace = true, default-features = false }
geometry-cs     = { workspace = true, default-features = false }

[dev-dependencies]
trybuild        = "1"
geometry-tag    = { workspace = true }                      # for trybuild ui fixtures
geometry-coords = { workspace = true, features = ["std"] }  # bring std for tests
geometry-cs     = { workspace = true, features = ["std"] }  # bring std for tests

[lints]
workspace = true
