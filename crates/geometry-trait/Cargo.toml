[package]
name = "geometry-trait"
version                = "0.0.9"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
keywords.workspace     = true
categories.workspace   = true
description = "Concept traits (Point, Linestring, Ring, Polygon, multi-variants, …) for the Boost.Geometry Rust port — implement them for your own types."
readme = "README.md"

[features]
default = ["std"]
std = ["geometry-coords/std", "geometry-cs/std"]
libm = ["geometry-coords/libm"]

[dependencies]
geometry-tag    = { version = "0.0.7", path = "../geometry-tag" }
geometry-coords = { version = "0.0.9", path = "../geometry-coords", default-features = false }
geometry-cs     = { version = "0.0.9", path = "../geometry-cs",     default-features = false }

[dev-dependencies]
trybuild        = "1"
geometry-tag    = { path = "../geometry-tag" }      # for trybuild ui fixtures
geometry-coords = { path = "../geometry-coords" }   # bring std for tests
geometry-cs     = { path = "../geometry-cs" }       # bring std for tests

[lints]
workspace = true
