name: Publish

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Test and publish to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Verify tag matches workspace version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match workspace version v${version}" >&2
            exit 1
          fi
      - name: Publish workspace crates in dependency order
        # crates.io rate-limits new-crate publishes (burst, then ~1 per
        # 10 min). Retry only on 429 until the whole workspace is through;
        # already-published crates are skipped on each retry.
        run: |
          packages=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"')
          total=$(echo "$packages" | wc -l)
          for attempt in $(seq 1 40); do
            excludes=""
            published=0
            while read -r name version; do
              if curl -fsSL -A "boost_geometry-ci (github.com/pentatonick/boost_geometry)" \
                  "https://crates.io/api/v1/crates/${name}/${version}" >/dev/null 2>&1; then
                excludes="$excludes --exclude $name"
                published=$((published + 1))
              fi
            done <<< "$packages"
            echo "${published}/${total} crates already published"
            if [ "$published" -eq "$total" ]; then
              echo "All crates published."
              exit 0
            fi
            set +e
            output=$(cargo publish --workspace $excludes 2>&1)
            code=$?
            set -e
            echo "$output" | tail -n 40
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if ! echo "$output" | grep -q "429 Too Many Requests"; then
              exit "$code"
            fi
            echo "Rate limited (attempt ${attempt}); waiting 11 minutes..."
            sleep 660
          done
          echo "Still rate limited after 40 attempts" >&2
          exit 1
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Create GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
